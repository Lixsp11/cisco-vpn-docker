name: Build

# Builds the image from the Cisco package at the secret CSC_DEB_URL and pushes it to ghcr.io.
# The package on ghcr.io must stay private: the image contains the Cisco Secure Client, and Cisco's
# software terms do not allow providing it to third parties. Check its visibility in the package settings.

# Runs only when started by hand (Actions tab, gh workflow run or the REST API)
on: workflow_dispatch

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # A package that a workflow creates on ghcr.io inherits the repository's visibility, so the build
      # runs only in a private repository. Values missing from the event payload count as not private.
      - name: Require a private repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != true ] || [ "$REPOSITORY_VISIBILITY" != private ]; then
            echo "::error::This workflow runs only in a private repository; the event reports private '$REPOSITORY_PRIVATE', visibility '$REPOSITORY_VISIBILITY'"
            exit 1
          fi

      # Pushing to a public package would publish the image. ghcr.io lets anyone pull a public package
      # without credentials, so this step asks it for anonymous pull access: granted stops the build.
      # Refused (HTTP 401, 403 or 404) means that the package is private or does not exist yet; a new
      # package gets the repository's visibility, which the step above requires to be private.
      # Any other answer stops the build.
      - name: Check the image destination
        id: image
        env:
          # Full image name ghcr.io/<owner>/<name>; without the variable IMAGE_NAME, ghcr.io/<owner>/<repository>
          IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}
        run: |
          refuse() {
            echo "::error::$1"
            exit 1
          }

          # Image names must be lowercase, and GitHub owner and repository names can contain uppercase letters
          image=${IMAGE_NAME,,}
          if ! [[ $image =~ ^ghcr\.io/([a-z0-9-]+/[a-z0-9][a-z0-9._-]*)$ ]]; then
            refuse "The image name '$image' is not of the form ghcr.io/<owner>/<name>"
          fi
          repository=${BASH_REMATCH[1]}
          refused="ghcr.io refuses anonymous pulls of $image; the package is private or does not exist yet"
          unclear="Cannot tell whether $image is public"

          # Anonymous pull token from the registry's token service (the realm in its WWW-Authenticate header).
          # curl prints the HTTP status code; a failed transfer stops the build even when a status was received.
          response=$RUNNER_TEMP/ghcr-token.json
          status=$(curl -sS -o "$response" -w '%{http_code}' \
            "https://ghcr.io/token?scope=repository:$repository:pull&service=ghcr.io") ||
            refuse "$unclear: the request to the token service failed (curl exit code $?)"
          case $status in
            401 | 403 | 404)
              echo "$refused (token service: HTTP $status)"
              ;;
            200)
              token=$(jq -r '.token // empty' "$response" 2>/dev/null || true)
              [ -n "$token" ] || refuse "$unclear: the token service answered HTTP 200 without a token"
              status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
                "https://ghcr.io/v2/$repository/tags/list") ||
                refuse "$unclear: the request for the tag list failed (curl exit code $?)"
              case $status in
                200) refuse "The package $image is public: anyone can pull it without credentials" ;;
                401 | 403 | 404) echo "$refused (tag list: HTTP $status)" ;;
                *) refuse "$unclear: the tag list answered HTTP $status" ;;
              esac
              ;;
            *)
              refuse "$unclear: the token service answered HTTP $status"
              ;;
          esac
          echo "name=$image" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Download and check the Cisco package
        id: package
        env:
          # Download URL of the full Cisco Secure Client VPN package for Linux, such as a presigned object storage URL
          CSC_DEB_URL: ${{ secrets.CSC_DEB_URL }}
        run: |
          if [ -z "$CSC_DEB_URL" ]; then
            echo "::error::The secret CSC_DEB_URL is not set"
            exit 1
          fi
          download=packages/download.deb
          # curl's error messages can contain the host name of the URL, which the log masking of the secret does not cover
          curl -fsSL -o "$download" "$CSC_DEB_URL" 2>/dev/null || {
            echo "::error::Downloading the package from CSC_DEB_URL failed (curl exit code $?)"
            exit 1
          }

          package=$(dpkg-deb -f "$download" Package)
          architecture=$(dpkg-deb -f "$download" Architecture)
          version=$(dpkg-deb -f "$download" Version)
          if [ "$package" != cisco-secure-client-vpn ] || [ "$architecture" != amd64 ]; then
            echo "::error::The package is $package for $architecture; the Dockerfile installs cisco-secure-client-vpn for amd64"
            exit 1
          fi
          # The version becomes part of the file name and the image tag
          if ! [[ $version =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::The package version $version cannot be used as an image tag"
            exit 1
          fi

          file="cisco-secure-client-vpn_${version}_amd64.deb"
          mv "$download" "packages/$file"
          echo "Package $file"
          {
            echo "version=$version"
            echo "file=$file"
          } >>"$GITHUB_OUTPUT"

      # A docker-container builder: build-push-action adds a provenance attestation by default, and the
      # default docker driver fails to build one when the Docker daemon uses the classic image store
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          # The checked-out directory, which holds the downloaded package; the action's default Git context does not
          context: .
          build-args: CSC_DEB=${{ steps.package.outputs.file }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.package.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
